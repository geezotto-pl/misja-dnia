<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misja Dnia</title>
<meta name="theme-color" content="#F3EAD3">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Misja Dnia">
<style>
@font-face{font-family:"Caveat";font-weight:700;font-display:swap;src:url(fonts/caveat-latin-ext-700-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Caveat";font-weight:700;font-display:swap;src:url(fonts/caveat-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --paper:#F3EAD3; --paper2:#FBF6EA; --line:#D9CBA8; --ink:#3B2F2A; --ink2:#6E5F55;
  --red:#B5442F; --red2:#8E3220; --green:#4F6B3A; --blue:#2D4A6B; --gold:#C08A2B;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;background:
  repeating-linear-gradient(0deg,transparent 0 33px,rgba(150,120,70,.10) 33px 34px),
  var(--paper)}
#app{max-width:560px;margin:0 auto;padding:16px 18px calc(110px + env(safe-area-inset-bottom));min-height:100vh;position:relative}
.top{display:flex;align-items:center;gap:10px;min-height:44px;margin-bottom:6px}
.back{border:none;background:none;font-size:26px;color:var(--ink2);padding:4px 8px;margin-left:-8px;cursor:pointer}
.prog{flex:1;height:8px;border-radius:8px;background:rgba(59,47,42,.12);overflow:hidden}
.prog i{display:block;height:100%;background:var(--red);border-radius:8px;transition:width .35s}
.step-label{font-size:14px;color:var(--ink2);min-width:46px;text-align:right}
h1,h2,.hand{font-family:var(--hand);font-weight:700;line-height:1.1}
h1{font-size:52px;margin:6px 0 4px;color:var(--red)}
h2{font-size:38px;margin:10px 0 6px}
p.lead{font-size:19px;color:var(--ink2);margin:4px 0 18px}
.small{font-size:15px;color:var(--ink2)}
.page{background:var(--paper2);border:1px solid var(--line);border-radius:6px 18px 18px 6px;box-shadow:0 2px 0 var(--line),0 10px 24px rgba(80,60,30,.10);padding:22px 18px;position:relative;animation:in .3s ease}
.page:before{content:"";position:absolute;left:0;top:14px;bottom:14px;border-left:2px dotted rgba(181,68,47,.35)}
@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.lbl{font-weight:600;margin:18px 0 8px;display:block}
input[type=text],textarea{width:100%;font:inherit;padding:14px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:11px 16px;font:inherit;font-size:17px;cursor:pointer;min-height:48px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper2)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:14px 16px;font:inherit;cursor:pointer;min-height:58px;width:100%}
.opt .em{font-size:28px;width:36px;text-align:center;flex:none}
.opt b{display:block}
.opt span.s{display:block;font-size:15px;color:var(--ink2)}
.opt.on{border-color:var(--red);background:#FFF4EE;box-shadow:inset 0 0 0 1px var(--red)}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:16px;font:inherit;font-weight:700;font-size:19px;cursor:pointer;min-height:56px}
.btn.main{background:var(--red);color:#fff;box-shadow:0 3px 0 var(--red2)}
.btn.main:disabled{background:#cbb9a4;box-shadow:none;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.link{background:none;color:var(--blue);font-weight:600;min-height:44px;padding:8px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--paper) 30%)}
.bar .in{max-width:524px;margin:0 auto}
.err{color:var(--red);font-size:15px;min-height:20px;margin-top:6px}
/* this-or-that */
.tot{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 22px}
.tot .side{background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px 12px;text-align:center;font-weight:600;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tot .side .em{font-size:36px}
.scale{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:0 4px}
.dot{border-radius:50%;border:3px solid var(--line);background:#fff;cursor:pointer;flex:none;padding:0}
.dot.d2{width:58px;height:58px}.dot.d1{width:46px;height:46px}.dot.d0{width:36px;height:36px}
.dot.L{border-color:var(--blue)}.dot.R{border-color:var(--green)}
.dot.on.L{background:var(--blue)}.dot.on.R{background:var(--green)}.dot.on.M{background:var(--ink2);border-color:var(--ink2)}
.scale-cap{display:flex;justify-content:space-between;font-size:14px;color:var(--ink2);margin-top:8px;padding:0 2px}
/* scenes */
.scene{background:#fff;border:2px dashed var(--line);border-radius:14px;padding:18px;margin:10px 0 18px;font-size:21px;font-weight:600;text-align:center}
.scene .area{display:block;font-size:14px;font-weight:500;color:var(--ink2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
/* type */
.tgl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tgl button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 8px;font:inherit;font-size:15px;cursor:pointer;min-height:64px;color:var(--ink)}
.tgl button b{display:block;font-size:24px;font-family:var(--hand)}
.tgl button.on{background:var(--ink);color:var(--paper2);border-color:var(--ink)}
.typecode{font-family:var(--hand);font-size:56px;text-align:center;color:var(--red);letter-spacing:.06em;margin:6px 0}
/* avatar */
.avbox{width:170px;height:170px;margin:6px auto 14px;border-radius:50%;overflow:hidden;border:4px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;font-size:64px}
.avbox img,.avbox svg{width:100%;height:100%;object-fit:cover;display:block}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.cats .chip{flex:none;padding:8px 14px;min-height:40px;font-size:15px}
.cycler{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 10px}
.cycler button{width:64px;height:56px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:26px;cursor:pointer;color:var(--ink)}
.cycler .v{font-weight:600}
.swatches{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);cursor:pointer}
.sw.on{border-color:var(--ink)}
/* passport */
.passport{background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;box-shadow:0 10px 26px rgba(80,60,30,.14)}
.pp-head{background:var(--blue);color:#F3EAD3;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.pp-head b{font-family:var(--hand);font-size:24px;letter-spacing:.02em;text-transform:none}
.pp-body{padding:18px;display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:start}
.pp-photo{width:118px;height:148px;border:3px solid var(--ink);border-radius:6px;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;font-size:48px}
.pp-photo img,.pp-photo svg{width:100%;height:100%;object-fit:cover}
.pp-name{font-family:var(--hand);font-size:34px;line-height:1}
.pp-class{font-family:var(--hand);font-size:28px;color:var(--red);line-height:1.05;margin:4px 0 8px}
.pp-row{font-size:14px;color:var(--ink2);border-bottom:1px dotted var(--line);padding:3px 0}
.pp-row b{color:var(--ink);font-weight:600}
.pp-desc{padding:0 18px 14px;font-style:italic;color:var(--ink2)}
.sec{margin-top:22px}
.sec h3{font-family:var(--hand);font-size:30px;margin:0 0 8px}
.radar{display:block;margin:0 auto;max-width:330px;width:100%}
.mtr{margin:10px 0}
.mtr .lab{display:flex;justify-content:space-between;font-size:14px;color:var(--ink2)}
.mtr .track{height:10px;border-radius:10px;background:rgba(59,47,42,.12);position:relative;margin-top:4px}
.mtr .track i{position:absolute;top:-4px;width:18px;height:18px;border-radius:50%;background:var(--ink);transform:translateX(-50%)}
.stamps{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:6px 0}
.stamp{border:3px double var(--red);color:var(--red);border-radius:12px;padding:6px 12px;font-family:var(--hand);font-size:22px;transform:rotate(-4deg);background:rgba(255,255,255,.4)}
.stamp:nth-child(2n){transform:rotate(3deg);color:var(--green);border-color:var(--green)}
.stamp:nth-child(3n){transform:rotate(-1deg);color:var(--blue);border-color:var(--blue)}
.mission{background:#fff;border:2px solid var(--line);border-left:6px solid var(--green);border-radius:12px;padding:12px 14px;margin:10px 0}
.mission.N{border-left-color:var(--gold)}.mission.H{border-left-color:var(--red)}.mission.X{border-left-color:#5b2a86}
.mission .t{font-weight:600}
.lvl{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px;margin-top:6px;background:#E5ECDD;color:var(--green)}
.lvl.N{background:#F6EAD0;color:#8a5f12}.lvl.H{background:#F6DDD5;color:var(--red2)}.lvl.X{background:#E9DDF2;color:#5b2a86}
.mission .cmp{font-size:14px;color:var(--ink2);margin-top:6px}
.rate{display:flex;justify-content:space-between;gap:6px;margin:8px 0 12px}
.rate button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;font-size:28px;padding:8px 0;cursor:pointer;min-height:58px}
.rate button.on{border-color:var(--red);background:#FFF4EE}
.slider{margin:14px 0}
.slider .lab{display:flex;justify-content:space-between;font-weight:600}
input[type=range]{width:100%;accent-color:var(--red);height:32px}
.note{background:#FFF8E1;border:1px solid #E8D49A;border-radius:12px;padding:10px 14px;font-size:15px;margin:12px 0}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper2);padding:10px 18px;border-radius:999px;font-size:15px;z-index:9;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.welcome-art{display:flex;justify-content:center;margin:18px 0 8px}
.hidden{display:none!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sep{border:none;border-top:2px dotted var(--line);margin:22px 0}
/* ===== gra ===== */
body.withnav #app{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;background:var(--paper2);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom));z-index:5;box-shadow:0 -4px 14px rgba(80,60,30,.08)}
.nav button{flex:1;max-width:170px;border:none;background:none;font:inherit;font-size:13px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;cursor:pointer}
.nav button span{font-size:22px}
.nav button.on{color:var(--red);background:#FFF1EA;font-weight:700}
.dayhead{display:flex;justify-content:space-between;align-items:flex-end;margin:4px 0 8px}
.xpbox{text-align:right;font-size:14px;color:var(--ink2)}.xpbox b{font-size:26px;color:var(--ink);font-family:var(--hand)}
.modebar{font-size:15px;color:var(--ink2);margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mini{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.tester{background:#EEF3F8;border:1px dashed var(--blue);color:var(--blue);border-radius:12px;padding:10px 12px;font-size:15px;margin-bottom:12px}
.mcard{background:#fff;border:2px solid var(--line);border-left:7px solid var(--green);border-radius:14px;padding:14px;margin:12px 0;cursor:pointer;position:relative;box-shadow:0 2px 0 var(--line)}
.mcard.N{border-left-color:var(--gold)}.mcard.H{border-left-color:var(--red)}.mcard.X{border-left-color:#5b2a86}
.mcard.done{opacity:.6}.mcard.empty{cursor:default;border-left-color:var(--line)}
.mtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.kat{font-size:13px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.mt{font-weight:600;font-size:19px;line-height:1.35}
.meta{font-size:14px;color:var(--ink2);margin-top:8px}
.donebadge{position:absolute;right:12px;bottom:10px;font-family:var(--hand);font-size:24px;color:var(--green);transform:rotate(-6deg);border:2px solid var(--green);border-radius:8px;padding:0 8px;background:#fff}
.rowbtn{margin-top:10px}
.links{margin-top:10px}.center{text-align:center}
.why{font-size:13px;color:var(--blue);background:#EEF3F8;border-radius:10px;padding:8px 10px;margin:10px 0}
.box{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.box .btn{margin-top:8px}.box p{margin:6px 0}
.big{font-size:20px;font-weight:700}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:2px solid var(--line);background:#eee}
.timer{font-family:var(--hand);font-size:56px;text-align:center;color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 6px}
.stats div{background:#fff;border:2px solid var(--line);border-radius:12px;text-align:center;padding:8px 2px}
.stats b{display:block;font-family:var(--hand);font-size:30px;line-height:1}.stats span{font-size:12px;color:var(--ink2)}
.jday{font-family:var(--hand);font-size:24px;margin:18px 0 6px;color:var(--ink2)}
.jentry{display:flex;gap:12px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.jstamp{flex:none;width:74px;height:74px;border-radius:50%;border:3px double var(--green);color:var(--green);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;text-align:center;transform:rotate(-8deg);font-weight:600;line-height:1.1}
.jstamp b{font-family:var(--hand);font-size:22px}
.jstamp.N{border-color:var(--gold);color:#8a5f12}.jstamp.H{border-color:var(--red);color:var(--red)}.jstamp.X{border-color:#5b2a86;color:#5b2a86}
.jbody{flex:1;min-width:0}.jnote{font-style:italic;color:var(--ink2);font-size:15px;margin:4px 0}
.brow{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:16px}
.brow.off{opacity:.45}
.mapframe{width:100%;height:220px;border:2px solid var(--line);border-radius:12px;margin:8px 0 2px;background:#e8e4d8}
.hint{background:#FFF8E1;border:1px solid #E8D49A;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:16px}.hint summary{font-weight:700;cursor:pointer}.hint ul{margin:8px 0 0;padding-left:20px}.hint li{margin:4px 0}
.nearby{background:#F3F7EE;border:1px solid #CFDDBF;border-radius:12px;padding:10px 12px;margin:10px 0}.nearby summary{font-weight:700;cursor:pointer;color:var(--green)}.nearby ul{margin:6px 0 0;padding-left:20px}.nearby li{margin:4px 0}.nearby a{color:var(--green);font-weight:600}
.herotag{display:inline-block;background:#2b1d3a;color:#f3d38a;font-weight:700;font-size:13px;letter-spacing:.06em;border-radius:999px;padding:3px 10px;margin:4px 0}
.herobox{background:#F4EEF9;border:1px dashed #5b2a86;border-radius:14px;padding:12px 14px;margin:12px 0}.herobox b{color:#5b2a86}
.chk{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:16px}.chk input{width:22px;height:22px}
.dots{display:flex;gap:8px;justify-content:center;margin-top:18px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--red)}
.wkhead{font-family:var(--hand);font-size:26px;margin:20px 0 -4px}
.mcard.wk{background:#FFFCF3;border-style:dashed}
.steps{display:inline-flex;gap:4px;vertical-align:middle;margin-right:4px}.steps i{width:12px;height:12px;border-radius:50%;border:2px solid var(--green);display:inline-block}.steps i.on{background:var(--green)}
.tag{background:#EEF3F8;color:var(--blue);border-radius:999px;padding:1px 8px;font-size:12px}
</style>
</head>

function steps(){
  var s=["welcome","name","age","place","time","typeAsk"];
  if(D.knowType==="yes"){s.push("typePick","pathPick")}

  if(!quick){s.push("sceneIntro");for(var j=0;j<SCENES.length;j++)s.push("sc"+j)}
  s.push("goals");
  if(!quick){s.push("limits","perms")}
  s.push("avatar","card");
  return s;
}
function go(id,push){
  if(push!==false&&S.step&&S.step!==id){S.hist.push(S.step);try{history.pushState({s:id},"")}catch(e){}}

}
function next(){var s=steps(),i=s.indexOf(S.step);go(s[Math.min(i+1,s.length-1)])}

function axisVals(){
  var ax={intro:50,spontan:50,nowosc:50,dom:50,solo:50,mysl:50,zabawa:50,sowa:50,ryzyko:50};
  if(D.knowType==="yes"&&D.type){
    var t=D.type;
    ax.intro=t.EI==="I"?75:25;
    ax.nowosc=t.SN==="N"?70:35;ax.mysl=t.SN==="N"?70:30;
    ax.spontan=t.JP==="P"?75:25;
    ax.ryzyko=clamp(50+(t.JP==="P"?10:-10)+(t.SN==="N"?10:-10)+(t.AT==="A"?5:t.AT==="T"?-5:0),0,100);
    ax.solo=t.EI==="I"?65:35;
    return ax;
  }
  var sums={},cnt={};
  TOT.forEach(function(q,i){var v=D.tot&&D.tot[i];if(v==null)return;sums[q.ax]=(sums[q.ax]||0)+v;cnt[q.ax]=(cnt[q.ax]||0)+1});
  for(var k in sums)ax[k]=clamp(50+25*sums[k]/cnt[k],0,100);
  return ax;
}
function comfortBase(){
  var c={S:5,B:5,M:5,C:5,A:5};
  var quick=D.knowType==="yes"&&D.path==="quick";
  var ax=axisVals();
  if(quick&&D.type){
    var t=D.type;
    c.S=t.EI==="E"?7:3.5; if(t.TF==="F")c.S+=.5;
    c.B=5+(t.SN==="S"?.5:0);
    c.M=5+(t.TF==="T"?.5:0)+(t.JP==="J"?.5:0);
    c.C=5+(t.SN==="N"?1:0)+(t.JP==="P"?.5:0);
    c.A=5+(t.SN==="N"?1:-.5)+(t.JP==="P"?.5:0);
    var d=t.AT==="A"?.5:t.AT==="T"?-.5:0;
    for(var k in c)c[k]=r1(clamp(c[k]+d,1,10));
    return c;
  }
  var sum={},n={};
  SCENES.forEach(function(s,i){var v=D.sc&&D.sc[i];if(v==null)return;sum[s.ar]=(sum[s.ar]||0)+v;n[s.ar]=(n[s.ar]||0)+1});
  for(var a in sum)c[a]=sum[a]/n[a];
  c.S+=(50-ax.intro)/50;
  c.A+=(ax.nowosc-50)/50*.7+(ax.ryzyko-50)/50*.5;
  c.B+=(50-ax.dom)/50*.7;
  for(var k2 in c)c[k2]=r1(clamp(c[k2],0,10));
  return c;
}
function applyPending(){
  if(D.pending&&D.pending.from&&new Date()>=new Date(D.pending.from)){D.comfort=D.pending.c;delete D.pending;save()}
}
function comfort(){applyPending();return D.comfort||comfortBase()}

function nextMonday(){var d=new Date();d.setHours(0,0,0,0);var add=(8-d.getDay())%7||7;d.setDate(d.getDate()+add);return d}
function fmtDate(d){return("0"+d.getDate()).slice(-2)+"."+("0"+(d.getMonth()+1)).slice(-2)}
function effDiff(m,c){var dis=0;for(var k in m.w)dis+=m.w[k]*(10-c[k])/10;return m.i*(1+1.5*dis)}
function level(v){for(var i=0;i<LEVELS.length;i++)if(v<LEVELS[i].max)return LEVELS[i];return LEVELS[3]}
function ranked(c){return AREAS.map(function(a){return{k:a.k,v:c[a.k]}}).sort(function(x,y){return y.v-x.v})}
function charClass(){
  var c=comfort(),ax=axisVals(),r=ranked(c),top=r[0].k,sec=r[1].k;
  var noun={S:["Ambasador","Ambasadorka"],B:["Wędrowiec","Wędrowniczka"],M:["Mędrzec","Mędrczyni"],C:["Alchemik","Alchemiczka"],A:["Odkrywca","Odkrywczyni"]};
  var adj={S:["Towarzyski","Towarzyska"],B:["Niestrudzony","Niestrudzona"],M:["Uważny","Uważna"],C:["Pomysłowy","Pomysłowa"],A:["Śmiały","Śmiała"]};
  var desc={
    S:"Ludzie dodają ci energii. Twoje misje pomogą ci rozwinąć się też tam, gdzie kontakt z innymi nie jest potrzebny.",
    B:"Najlepiej myśli ci się w ruchu. Misje wyciągną cię na nowe trasy, ale też do rzeczy, które robi się na siedząco.",
    M:"Lubisz zrozumieć, zanim zaczniesz. Misje dadzą ci okazję, by z głowy przejść do działania.",
    C:"Masz pomysły i lubisz tworzyć. Misje pomogą ci pokazać to, co robisz, i wyjść poza strefę komfortu.",
    A:"Najlepiej czujesz się tam, gdzie jeszcze cię nie było. Misje dorzucą do odkrywania trochę rytmu i nawyków."
  };
  var f=D.form==="f"?1:0,name;
  if(top==="S"&&ax.intro<=35)name="Dusza Towarzystwa";
  else if(ax.intro>=65&&top!=="S")name=(f?"Cicha ":"Cichy ")+noun[top][f];
  else name=adj[sec][f]+" "+noun[top][f];
  return{name:name,desc:desc[top],top:top,low:r[4].k};

function sampleMissions(c){
  var src=window.BASE?BASE.filter(function(e){return e.rytm==="d"&&!e.mapa}).map(function(e){var w=e.wym||[];return{t:e.t,i:e.i,w:e.w,g:[e.kat],tag:(w.indexOf("koszt")>=0?["cost"]:[]).concat(w.indexOf("intens")>=0?["intense"]:[]).concat(w.indexOf("jedzenie")>=0?["food"]:[]).concat(w.indexOf("dzwonienie")>=0?["phone"]:[])}}):MISSIONS;
  var ok=src.filter(function(m){
    var t=m.tag||[];
    if(D.budget==="free"&&t.indexOf("cost")>=0)return false;
    if(D.mobility&&D.mobility!=="none"&&t.indexOf("intense")>=0)return false;
    if(D.avoid&&D.avoid.indexOf("food")>=0&&t.indexOf("food")>=0)return false;
    if(D.avoid&&D.avoid.indexOf("phone")>=0&&t.indexOf("phone")>=0)return false;
    return true;
  }).map(function(m){var e=effDiff(m,c);var goal=(D.goals||[]).some(function(g){return m.g.indexOf(g)>=0});return{m:m,e:e,l:level(e),goal:goal}});
  var pick=[],used={};
  [["E"],["N"],["H","X"]].forEach(function(want){
    var cand=ok.filter(function(x){return want.indexOf(x.l.c)>=0&&!used[x.m.t]});
    cand.sort(function(a,b){return(b.goal-a.goal)||(a.e-b.e)});
    if(cand.length){pick.push(cand[0]);used[cand[0].m.t]=1}
  });
  if(pick.length<3){ok.sort(function(a,b){return(b.goal-a.goal)||(b.e-a.e)}).forEach(function(x){if(pick.length<3&&!used[x.m.t]){pick.push(x);used[x.m.t]=1}})}
  return pick.sort(function(a,b){return a.e-b.e});
}

function chips(name,list,multi){
  return '<div class="chips">'+list.map(function(o){
    var on=multi?((D[name]||[]).indexOf(o[0])>=0):D[name]===o[0];
    return '<button class="chip'+(on?" on":"")+'" onclick="pick(\''+name+'\',\''+o[0]+'\','+(multi?1:0)+')">'+o[1]+'</button>'}).join("")+'</div>';

function pick(name,val,multi){
  if(multi){var a=D[name]||[];var i=a.indexOf(val);if(i>=0)a.splice(i,1);else a.push(val);D[name]=a}
  else D[name]=val;
  save();render();
}

function radar(c){
  var cx=165,cy=150,R=105,n=5,pts=[],grid="",labels="";
  function P(i,r){var a=-Math.PI/2+i*2*Math.PI/n;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]}
  for(var lv=1;lv<=4;lv++){grid+='<polygon points="'+AREAS.map(function(_,i){return P(i,R*lv/4).join(",")}).join(" ")+'" fill="none" stroke="#D9CBA8" stroke-width="1.5" stroke-dasharray="'+(lv<4?"3 4":"0")+'"/>'}
  AREAS.forEach(function(a,i){var p=P(i,R);grid+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="#D9CBA8" stroke-width="1.5"/>';
    var l=P(i,R+26);labels+='<text x="'+l[0]+'" y="'+(l[1]+5)+'" text-anchor="middle" font-size="15" fill="#3B2F2A" font-family="system-ui">'+a.em+' '+a.n+'</text>';
    pts.push(P(i,Math.max(.6,c[a.k])/10*R).join(","))});
  var dots=AREAS.map(function(a,i){var p=P(i,Math.max(.6,c[a.k])/10*R);return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="#B5442F"/>'}).join("");
  return '<svg class="radar" viewBox="0 0 330 300" role="img" aria-label="Strefy komfortu">'+grid+
    '<polygon points="'+pts.join(" ")+'" fill="rgba(181,68,47,.22)" stroke="#B5442F" stroke-width="3" stroke-linejoin="round"/>'+dots+labels+'</svg>';
}

  else if(st&&st!=="welcome"&&steps().indexOf(st)>=0){S.step=st;var s=steps();S.hist=s.slice(0,s.indexOf(st))}
  else S.step="welcome";
  if(S.step==="avatar"&&D.avatar&&D.avatar.kind==="building")loadAv(function(){});
  try{history.replaceState({s:S.step},"")}catch(e){}
  render();
}
</script>
